<!doctype html>
<html lang="en" data-palette="{default_palette}" data-palette-options="{palette_ids}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="chapter-csrf-token" content="{csrf_token}">
  <title>{title}</title>
  <link rel="icon" type="image/png" href="/assets/chapter-logo.png">
  <script>{theme_script}</script>
  <style>
{styles}  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="admin-shell">
    <header class="admin-header">
      <a class="app-brand" href="{home_url}">
        <img class="app-logo" src="/assets/chapter-logo.png" width="48" height="36" alt="">
        <span>Chapter Player</span>
      </a>
      <label class="admin-theme" hidden>
        <span>Appearance</span>
        <select aria-label="Appearance" data-admin-theme>
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <button type="button" class="admin-menu-toggle" aria-label="Main menu" aria-controls="admin-menu" aria-expanded="false" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path class="menu-lines" d="M3 5h18M3 12h18M3 19h18"/><path class="menu-cross" d="m5 5 14 14M19 5 5 19"/></svg>
      </button>
    </header>
    <aside class="admin-sidebar" id="admin-menu">
      <nav class="admin-nav" aria-label="Player administration">
        {navigation}
      </nav>
      <div class="menu-appearance" hidden>
        <label class="menu-palette">Colour palette<select data-admin-palette>{palette_choices}</select></label>
      </div>
    </aside>
    <main id="main-content" class="admin-main" tabindex="-1">
      {content}
    </main>
  </div>
  {scripts}
</body>
</html>
