<header class="page-heading"><h1>Audiobookshelf Player Health</h1></header>
<dl class="status row-dividers">
  <div class="status-row">
    <dt>Wi-Fi</dt>
    <dd class="status-value {wifi_class}" data-wifi-status>{wifi_value}</dd>
  </div>
  <div class="status-row">
    <dt>Audiobookshelf</dt>
    <dd class="status-value" data-connection-health role="status">{abs_value}</dd>
  </div>
  <div class="status-row">
    <dt>Software version</dt>
    <dd class="status-value"><strong>v{version}</strong></dd>
  </div>
</dl>
