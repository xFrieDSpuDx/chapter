<header class="page-heading">
  <h1>Themes</h1>
  <p class="muted">Your colour palette is saved in this browser.</p>
</header>
<fieldset class="palette-picker" data-palette-picker hidden>
  <legend class="sr-only">Colour palette</legend>
  <div class="palette-row palette-headings" aria-hidden="true">
    <span></span><span>Light</span><span>Dark</span>
  </div>
  <div class="row-dividers">
    {options}
  </div>
</fieldset>
<noscript>Enable JavaScript to choose a colour palette.</noscript>
