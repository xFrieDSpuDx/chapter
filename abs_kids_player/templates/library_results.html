<div class="library-results" data-library-results data-download-inventory="{inventory}" data-total="{total}"
     data-view="{view}" data-group="{group}" data-page="{page}" data-catalogue-pending="{catalogue_pending}">
  <div class="shelf-heading">
    <div><h2 id="browse-books" tabindex="-1">{results_title}</h2><p class="muted" role="status">{matches}</p></div>
    <div class="actions">{back_link}</div>
  </div>
  {notice}
  {books}
  {pagination}
</div>
