<header class="page-heading"><h1>Player</h1></header>
<div class="player-page" data-listening-player>
  <section data-player-opening="{opening_key}"{opening_hidden}>
    <h2>Opening book</h2>
    <button type="button" class="secondary" data-player-action="cancel_open">Cancel opening</button>
  </section>
  <section class="player-session" aria-labelledby="player-book" data-player-session{session_hidden}>
    <div class="player-book">
      {cover}
      <div class="player-book-info">
        <p class="player-state muted" data-player-playing>{playing}</p>
        <h2 id="player-book" data-player-title>{title}</h2>
        <p class="muted" data-player-author>{author}</p>
        <div class="player-source muted"><span data-player-output></span><span data-player-progress-status></span></div>
        <div class="player-position">
          <div class="player-times muted"><span data-player-elapsed>0:00</span><span data-player-remaining></span></div>
          <label class="sr-only" for="player-position">Listening position</label>
          <input id="player-position" data-player-seek type="range" min="0" max="0" step="1" value="0">
        </div>
        <div class="player-transport" aria-label="Playback controls" role="group">
          <button class="player-skip" type="button" data-player-action="skip_back"><span aria-hidden="true">↺</span><span class="sr-only">Back</span><span data-player-skip-back>{skip_back}s</span></button>
          <button class="player-toggle" type="button" data-player-toggle aria-label="{toggle}" title="{toggle}">{icon}</button>
          <button class="player-skip" type="button" data-player-action="skip_forward"><span aria-hidden="true">↻</span><span class="sr-only">Forward</span><span data-player-skip-forward>{skip_forward}s</span></button>
        </div>
      </div>
    </div>
    <div class="player-volume" role="group" aria-label="Volume controls">
      <div class="player-volume-reading"><label for="player-volume">Volume</label><span data-player-volume-label>{volume}%</span></div>
      <div class="player-volume-track">
        <button type="button" data-volume-step="-1" aria-label="Decrease volume by one percent">−</button>
        <input id="player-volume" data-player-volume type="range" min="0" max="100" step="1" value="{volume}">
        <button type="button" data-volume-step="1" aria-label="Increase volume by one percent">+</button>
      </div>
      <button type="button" data-player-mute>
        <svg class="player-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="sound-waves" d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="mute-cross" d="m16 9 6 6m0-6-6 6"/></svg>
        <span data-player-mute-label>{mute}</span>
      </button>
    </div>
    <div class="player-choices">
      <label class="field">Chapter<select data-player-chapters><option value="">No chapter markers</option></select></label>
      <label class="field">Speed<select data-player-speed aria-label="Playback speed">{speeds}</select></label>
      <label class="field">Sleep timer<select data-player-timer><option value="0">Off</option><option value="15">15 min</option><option value="30">30 min</option><option value="-1">End of chapter</option><option value="" disabled hidden>Active timer</option></select></label>
    </div>
    <p class="muted" data-player-sleep-status></p>
    <div class="player-tools" id="player-tools" role="tablist" aria-label="Listening tools">
      <button type="button" role="tab" id="tab-bookmarks" aria-controls="player-bookmarks" aria-selected="true"><svg class="player-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Bookmarks</button>
      <button type="button" role="tab" id="tab-queue" aria-controls="listening-queue" aria-selected="false" tabindex="-1"><svg class="player-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7m5-5 5 3-5 3z"/></svg>Queue</button>
      <button type="button" role="tab" id="tab-session" aria-controls="player-session-actions" aria-selected="false" tabindex="-1"><svg class="player-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h5m4 0h7M4 17h10m4 0h2"/><circle cx="11" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg>Session</button>
    </div>
    <section class="player-panel" id="player-bookmarks" role="tabpanel" aria-labelledby="tab-bookmarks">
      <div class="player-panel-heading"><h2>Saved places</h2><button class="player-text-button" type="button" data-player-action="bookmark"><span aria-hidden="true">＋</span> Save bookmark</button></div>
      <ul class="player-bookmark-list" data-player-bookmark-list></ul>
      <p class="muted" role="status" data-player-bookmark-status></p>
      <button class="player-text-button" type="button" data-player-retry-bookmarks hidden>Retry bookmarks</button>
      <button class="player-text-button" type="button" data-player-action="undo" disabled><span aria-hidden="true">↶</span> Undo last jump</button>
    </section>
    <section class="player-panel" id="player-session-actions" role="tabpanel" aria-labelledby="tab-session" hidden>
      <h2>Playback session</h2>
      <button class="player-session-action" type="button" data-player-action="stop">Stop playback</button>
      <button class="player-session-action" type="button" data-player-finish>Mark book finished</button>
    </section>
  </section>
  <section data-player-idle{idle_hidden}>
    <p>Nothing playing. <a href="/library">Choose a book in the Library</a> or start one from the listening queue.</p>
  </section>
  <section class="player-panel" id="listening-queue" aria-labelledby="listening-queue-heading"{queue_hidden}>
    <h2 id="listening-queue-heading" tabindex="-1">Listening queue</h2>
    <div class="listening-queue" data-listening-queue>{queue}</div>
  </section>
  <div class="player-feedback muted" role="status" data-player-feedback></div>
</div>
